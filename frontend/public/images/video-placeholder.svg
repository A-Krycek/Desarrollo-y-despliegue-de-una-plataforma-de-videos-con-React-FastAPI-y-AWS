<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background 16:9 -->
  <rect width="640" height="360" fill="url(#bg-grad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Central Circular Badge with Play/Film Icon -->
  <g transform="translate(320, 160)">
    <!-- Outer Glow Circle -->
    <circle r="52" fill="url(#accent-grad)" opacity="0.15" filter="url(#glow)" />
    
    <!-- Middle Circle -->
    <circle r="44" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="2" />

    <!-- Play Icon Triangle -->
    <polygon points="-8,-16 -8,16 16,0" fill="#f8fafc" opacity="0.9" />
  </g>

  <!-- Label text below badge -->
  <text x="320" y="245" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="1.5">
    VIDEO PLATFORM
  </text>
  <text x="320" y="268" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="11" 
        fill="#64748b" 
        text-anchor="middle" 
        letter-spacing="0.8">
    Amazon S3 • EC2 • RDS
  </text>
</svg>
